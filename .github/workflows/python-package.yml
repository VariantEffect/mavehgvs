# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# It will also update the test coverage using coveralls.io
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest pytest-cov
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Install package
      run: |
        python -m pip install .

    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest and output coverage report
      run: |
        pytest --cov=src --cov-report=lcov:coverage-${{ matrix.python-version }}.lcov
        wc -l coverage-${{ matrix.python-version }}.lcov
        head -20 coverage-${{ matrix.python-version }}.lcov

    - name: Test with pytest and output coverage report (terminal version)
      run: |
        pytest --cov=src --cov-report=term

    - name: Upload coverage artefact
      # save the file for the Python version we care about (3.11)
      if: matrix.python-version == '3.11'
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage-3.11.lcov

  # report coverage under Python 3.11 since that's what MaveDB is using
  coverage:
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage artefact
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: Coveralls GitHub Action
        uses: coverallsapp/github-action@v2
        with:
          file: coverage-3.11.lcov
